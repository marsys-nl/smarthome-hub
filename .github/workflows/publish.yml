name: Smarthome API - Runs on closing a pull request to main

on:
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:

jobs:
    publish:
        name: Publish to docker registry
        runs-on: macos-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Resolve version from Gradle
              id: versions
              run: |
                  VERSION=$(./gradlew -q :hub:properties --property version | tr -d '\r' | xargs)
                  IS_SNAPSHOT=false

                  if [[ "$VERSION" == *-SNAPSHOT ]]; then
                      IS_SNAPSHOT=true
                  fi

                  echo "value=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image (snapshot)
              if: steps.versions.outputs.snapshot == 'true'
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                    nmarsman/smarthome-hub:${{ steps.versions.outputs.value }}

            - name: Build and push Docker image (release)
              if: steps.versions.outputs.snapshot == 'false'
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                    nmarsman/smarthome-hub:${{ steps.versions.outputs.value }}
                    nmarsman/smarthome-hub:latest
