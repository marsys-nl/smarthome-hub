name: Smarthome Hub - Publish on merged pull request to main

on:
    pull_request:
        types: [closed]
        branches: [main]
        paths:
            - '**/src/main/**'
            - 'Dockerfile'
    workflow_dispatch:

jobs:
    publish:
        name: Publish to docker registry
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Resolve version from Gradle
              id: versions
              run: |
                  VERSION=$(./gradlew -q :hub:properties --property version | awk -F': ' '/^version:/ {print $2; exit}' | tr -d '\r')
                  if [[ -z "$VERSION" ]]; then
                      echo "Failed to resolve project version from Gradle output"
                      exit 1
                  fi

                  IS_SNAPSHOT=false
                  if [[ "$VERSION" == *-SNAPSHOT ]]; then
                      IS_SNAPSHOT=true
                  fi

                  echo "value=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build JAR
              run: ./gradlew :hub:buildFatJar

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image (snapshot)
              if: steps.versions.outputs.snapshot == 'true'
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                platforms: |
                    linux/arm64/v8
                cache-from: type=gha
                cache-to: type=gha,mode=max
                tags: |
                    nmarsman/smarthome-hub:${{ steps.versions.outputs.value }}

            - name: Build and push Docker image (release)
              if: steps.versions.outputs.snapshot == 'false'
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                cache-from: type=gha
                cache-to: type=gha,mode=max
                tags: |
                    nmarsman/smarthome-hub:${{ steps.versions.outputs.value }}
                    nmarsman/smarthome-hub:latest
