name: Smarthome Hub - Pull request validation

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Validate and build application
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Analyze code conventions using ktlint
              id: ktlint
              run: ./gradlew ktlintCheck

            - name: Analyze code conventions using detekt
              id: detekt
              run: ./gradlew detekt

            - name: Build project
              id: build
              run: ./gradlew build
