[versions]
smarthome-api = "2026.03-SNAPSHOT"
smarthome-domain = "2026.01-SNAPSHOT"
smarthome-hub = "2026.05-SNAPSHOT"

buildconfig = "6.0.9"

detekt = "2.0.0-alpha.2"

jvm-toolchain = "21"

logback = "1.5.32"

kotlin = "2.3.20"
kotlin-kover = "0.9.8"
kotlin-logging = "8.0.01"

ktlint = "1.8.0"

ktor = "3.4.2"

slf4j = "2.0.17"

[libraries]
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlin-logging" }

ktlint = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }

ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-auth-api-key = { group = "io.ktor", name = "ktor-server-auth-api-key", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-config-yaml = { group = "io.ktor", name = "ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-forwarded-header = { group = "io.ktor", name = "ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

smarthome-api = { group = "network.marsys.smarthome", name = "smarthome-api", version.ref = "smarthome-api" }

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }

detekt = { id = "dev.detekt", version.ref = "detekt" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kotlin-kover" }

ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

[bundles]
kotlin-logging = ["kotlin-logging", "slf4j-api", "logback-classic"]
