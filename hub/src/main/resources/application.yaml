ktor:
    deployment:
        port: ${ENV_PORT:8080}

smarthome:
    auth:
        apiKey: ${ENV_AUTH_API_KEY:}

        jwt:
            realm: ${ENV_AUTH_JWT_REALM:smarthome-app}
            issuer: ${ENV_AUTH_JWT_ISSUER:}
            jwk-url: ${ENV_AUTH_JWT_JWK_URL:}

    mqtt:
        broker:
            host: ${ENV_MQTT_BROKER_HOST:tcp://localhost:1883}
            username: ${ENV_MQTT_BROKER_USERNAME:}
            password: ${ENV_MQTT_BROKER_PASSWORD:}
